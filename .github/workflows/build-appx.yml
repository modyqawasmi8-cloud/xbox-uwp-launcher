name: Build Xbox APPX

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/build-appx.yml"

jobs:
  build:
    runs-on: windows-2022
    env:
      PROJECT_DIR: native/xbox-uwp-launcher
      CERT_PASSWORD: xbox-dev-1234
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Create self-signed test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=XboxUwpLauncher" `
            -KeyUsage DigitalSignature `
            -FriendlyName "XboxUwpLauncher Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\dev.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\XboxUwpLauncher.cer" | Out-Null

      - name: Build and package (APPX, x64, Release)
        shell: pwsh
        run: |
          msbuild "$env:PROJECT_DIR\XboxUwpLauncher.sln" /restore `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\dev.pfx" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\"

      - name: Collect output
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\XboxUwpLauncher.cer" "$env:GITHUB_WORKSPACE\AppPackages\"
          Get-ChildItem "$env:GITHUB_WORKSPACE\AppPackages" -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: XboxUwpLauncher-appx
          path: AppPackages/
