name: Build Xbox UWP APPX

on:
  push:
    branches:
      - main
    paths:
      - "native/xbox-uwp-launcher/**"
      - ".github/workflows/build-xbox-uwp-appx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed x64 sideload package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure UWP build tools are installed
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) {
            throw 'Visual Studio was not found on the Windows runner.'
          }

          $componentId = 'Microsoft.VisualStudio.ComponentGroup.UWP.Support'
          $hasUwpTools = & $vswhere -latest -products '*' -requires $componentId -property installationPath
          if (-not $hasUwpTools) {
            $installer = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vs_installer.exe'
            if (-not (Test-Path $installer)) {
              throw 'Visual Studio Installer was not found on the Windows runner.'
            }

            & $installer modify --installPath $vsPath --add $componentId --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) {
              throw "Installing the UWP build tools failed with exit code $LASTEXITCODE."
            }
          }

      - name: Create temporary package-signing certificate
        id: signing
        shell: pwsh
        run: |
          $password = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"

          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=XboxUwpLauncher' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'Temporary Xbox UWP Launcher CI certificate' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddMonths(6) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          $pfxPath = Join-Path $env:RUNNER_TEMP 'XboxUwpLauncher.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'XboxUwpLauncher.cer'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

          "pfx=$pfxPath" >> $env:GITHUB_OUTPUT
          "cer=$cerPath" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Build and sign APPX
        shell: pwsh
        env:
          APPX_PFX: ${{ steps.signing.outputs.pfx }}
          APPX_CERT_PASSWORD: ${{ steps.signing.outputs.password }}
        run: |
          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'native\xbox-uwp-launcher'
          $projectFile = Join-Path $projectDir 'XboxUwpLauncher.csproj'
          $packageDir = Join-Path $projectDir 'AppPackages'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          & msbuild.exe $projectFile `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxBundlePlatforms=x64 `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint= `
            "/p:PackageCertificateKeyFile=$env:APPX_PFX" `
            "/p:PackageCertificatePassword=$env:APPX_CERT_PASSWORD" `
            "/p:AppxPackageDir=$packageDir\"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare Xbox sideload files
        shell: pwsh
        env:
          APPX_CERTIFICATE: ${{ steps.signing.outputs.cer }}
        run: |
          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'native\xbox-uwp-launcher'
          $packageDir = Join-Path $projectDir 'AppPackages'
          $testDirectory = Get-ChildItem -Path $packageDir -Directory -Filter '*_Test' |
            Select-Object -First 1

          if (-not $testDirectory) {
            throw 'MSBuild did not create a sideload (_Test) package directory.'
          }

          Copy-Item $env:APPX_CERTIFICATE (Join-Path $testDirectory.FullName 'XboxUwpLauncher.cer') -Force
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'XboxUwpLauncher-Sideload'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Copy-Item (Join-Path $testDirectory.FullName '*') $outputDirectory -Recurse -Force

          @'
          Xbox UWP Launcher — Xbox Dev Mode sideload package

          1. Extract this downloaded artifact.
          2. In Xbox Dev Home, enable Device Portal.
          3. Open the Xbox Device Portal from a browser on the same network.
          4. Use its app-install page to upload the APPX and any listed dependency packages.
          5. Keep the included certificate with the package; the portal may request it for installation.
          '@ | Set-Content -Path (Join-Path $outputDirectory 'INSTALL.txt') -Encoding UTF8

      - name: Upload sideload package
        uses: actions/upload-artifact@v4
        with:
          name: XboxUwpLauncher-Sideload
          path: ${{ runner.temp }}/XboxUwpLauncher-Sideload/
          if-no-files-found: error
          retention-days: 14
